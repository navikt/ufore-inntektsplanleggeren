apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: inntektsplanleggeren-frontend-veileder
  namespace: pensjonselvbetjening
  labels:
    team: pensjonselvbetjening
spec:
  groups:
    - name: inntektsplanleggeren-frontend-veileder-alerts
      rules:
        - alert: Application is unavailable
          expr: kube_deployment_status_replicas_available{deployment="inntektsplanleggeren-frontend-veileder"} == 0
          for: 1m
          annotations:
            consequence: Inntektsplanleggeren veileder application is unavailable
            action: "https://logs.adeo.no/app/r/s/IUFfT"
          labels:
            namespace: pensjonselvbetjening # required
            severity: critical
        - alert: Failing deployment
          expr: kube_deployment_status_replicas_unavailable{deployment="inntektsplanleggeren-frontend-veileder"} > 1
          for: 5m
          annotations:
            consequence: Inntektsplanleggeren veileder failing deployment
            action: "https://logs.adeo.no/app/r/s/IUFfT"
          labels:
            namespace: pensjonselvbetjening # required
            severity: critical
