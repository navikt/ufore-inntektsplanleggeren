name: Bygg inntektsplanleggeren-frontend
on:
  workflow_dispatch:
  push:
    paths:
      - inntektsplanleggeren-frontend/**
    branches-ignore:
      - main  # Bygges allerede av deploy-workflow

jobs:
  build-frontend:
    name: Bygg med node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./inntektsplanleggeren-frontend
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          cache: npm
          cache-dependency-path: inntektsplanleggeren-frontend/package-lock.json

      - name: Cache node modules
        id: cache-node
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            inntektsplanleggeren-frontend/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Installer avhengigheter
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Bygg med node
        run: npm run build
        env:
          FARO_TELEMETRY_URL: 'https://telemetry.ekstern.dev.nav.no/collect'
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
