name: "Dev: inntektsplanleggeren-frontend deploy"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - inntektsplanleggeren-frontend/**

concurrency:
  group: dev-inntektsplanleggeren-frontend-deploy
  cancel-in-progress: true

jobs:
  build-frontend-and-publish-docker-borger:
    name: Bygg inntektsplanleggeren-frontend-borger
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./inntektsplanleggeren-frontend/
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bygg og publiser Docker-image
        uses: ./.github/actions/build-frontend
        id: build
        with:
          build_command: build
          reader_token: ${{ secrets.READER_TOKEN }}
          mode: borger-dev

  build-frontend-and-publish-docker-veileder:
    name: Bygg inntektsplanleggeren-frontend-veileder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bygg og publiser Docker-image
        uses: ./.github/actions/build-frontend
        id: build
        with:
          build_command: build:development:veileder
          reader_token: ${{ secrets.READER_TOKEN }}
          mode: veileder-dev

  deploy-frontend-borger-dev:
    needs: build-frontend-and-publish-docker-borger
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: inntektsplanleggeren-frontend/.nais/dev-borger.yml,inntektsplanleggeren-frontend/.nais/unleash-dev.yml
          IMAGE: ${{ needs.build-frontend-and-publish-docker-borger.outputs.image }}
          TEAM: ufore

  deploy-frontend-veileder-dev:
    needs: build-frontend-and-publish-docker-veileder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: inntektsplanleggeren-frontend/.nais/dev-veileder.yml,inntektsplanleggeren-frontend/.nais/unleash-dev.yml
          IMAGE: ${{ needs.build-frontend-and-publish-docker-veileder.outputs.image }}
          TEAM: ufore