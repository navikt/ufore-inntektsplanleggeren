name: Bygg inntektsplanleggeren-backend
on:
  workflow_dispatch:
  push:
    paths:
      - inntektsplanleggeren-backend/**
    branches-ignore:
      - main  # Bygges allerede av deploy-workflow

jobs:
  build-backend:
    name: Bygg med maven
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Bygg
        run: cd ./inntektsplanleggeren-backend && mvn -B package --file pom.xml
