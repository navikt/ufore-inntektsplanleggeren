apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: inntektsplanleggeren-frontend-borger-q2
  namespace: pensjonselvbetjening
  labels:
    team: pensjonselvbetjening
  annotations:
    nais.io/run-as-user: "101" # nginx
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
spec:
  image: "{{ image }}"
  ingresses:
    - https://borger.intern.dev.nav.no/uforetrygd/selvbetjening/inntektsplanleggeren
    - https://borger.ansatt.dev.nav.no/uforetrygd/selvbetjening/inntektsplanleggeren
    - https://borger.ekstern.dev.nav.no/uforetrygd/selvbetjening/inntektsplanleggeren
  port: 8080
  replicas:
    min: 1
    max: 1
  liveness:
    path: /internal/health/liveness
    initialDelay: 20
    periodSeconds: 20
    failureThreshold: 5
    timeout: 1
  readiness:
    path: /internal/health/readiness
    initialDelay: 20
    periodSeconds: 20
    failureThreshold: 5
    timeout: 1
  frontend:
    generatedConfig:
      mountPath: /usr/share/nginx/html/assets/nais.js
  idporten:
    enabled: true
    sidecar:
      level: idporten-loa-substantial
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        - /internal/ping
  tokenx:
    enabled: true
  accessPolicy:
    outbound:
      rules:
        - application: inntektsplanleggeren-backend-q2
  env:
    - name: "VITE_DECORATOR_URL"
      value: "https://dekoratoren.ekstern.dev.nav.no"
    - name: "INNTEKTSPLANLEGGEREN_BACKEND_URL"
      value: "http://inntektsplanleggeren-backend-q2"
    - name: "INNTEKTSPLANLEGGEREN_BACKEND_AUDIENCE"
      value: "dev-gcp:pensjonselvbetjening:inntektsplanleggeren-backend-q2"
