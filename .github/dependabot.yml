version: 2
updates:
  - package-ecosystem: maven
    directories:
      - /inntektsplanleggeren-backend/
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 50

  - package-ecosystem: npm
    directories:
      - /inntektsplanleggeren-frontend/
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 50
    groups:
      designsystemet:
        patterns:
          - '@navikt/ds*'
          - '@navikt/aksel*'
      react:
        patterns:
          - 'react'
          - 'react-dom'

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 10
