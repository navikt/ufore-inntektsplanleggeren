apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: inntektsplanleggeren-frontend-veileder-q2
  namespace: pensjonselvbetjening
  labels:
    team: pensjonselvbetjening
  annotations:
    nais.io/run-as-user: "101" # nginx
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
spec:
  image: "{{ image }}"
  ingresses:
    - https://veileder.intern.dev.nav.no/uforetrygd/selvbetjening/inntektsplanleggeren
    - https://veileder.ansatt.dev.nav.no/uforetrygd/selvbetjening/inntektsplanleggeren
  port: 8080
  replicas:
    min: 1
    max: 1
  liveness:
    path: /internal/health/liveness
    initialDelay: 20
    periodSeconds: 20
    failureThreshold: 5
    timeout: 1
  readiness:
    path: /internal/health/readiness
    initialDelay: 20
    periodSeconds: 20
    failureThreshold: 5
    timeout: 1
  azure:
    sidecar:
      autoLogin: true
      enabled: true
    application:
      allowAllUsers: false
      claims:
        extra:
          - "NAVident"
        groups:
          - id: "8bb9b8d1-f46a-4ade-8ee8-5895eccdf8cf" # 0000-GA-PENSJON_SAKSBEHANDLER
          - id: "a3f91493-1ab8-4b64-a544-0a77cbba9240" # 0000-GA-Pensjon_VEILEDER
          - id: "9e122ddd-e542-4cc1-a7eb-92c99140fe0e" # 0000-GA-PENSJON_BRUKERHJELPA
          - id: "05ae245b-7b47-428a-9074-4ff6b59eddbc" # 0000-GA-Pensjon_Okonomi
      enabled: true
      tenant: trygdeetaten.no

  accessPolicy:
    inbound:
      rules:
        - application: azure-token-generator # only in dev
          namespace: aura
          cluster: dev-gcp
    outbound:
      rules:
        - application: inntektsplanleggeren-backend-q2
          cluster: dev-gcp
          namespace: pensjonselvbetjening
  env:
    - name: "MODE"
      value: "veileder"
    - name: "INNTEKTSPLANLEGGEREN_BACKEND_URL"
      value: "http://inntektsplanleggeren-backend-q2"
    - name: "INNTEKTSPLANLEGGEREN_BACKEND_SCOPE"
      value: "api://dev-gcp.pensjonselvbetjening.inntektsplanleggeren-backend-q2/.default"
