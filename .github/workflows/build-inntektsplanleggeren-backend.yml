name: Bygg inntektsplanleggeren-backend
on:
  workflow_dispatch:
  push:
    paths:
      - inntektsplanleggeren-backend/**
    branches-ignore:
      - main  # Bygges allerede av deploy-workflow

jobs:
  build-backend:
    name: Bygg med maven
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Bygg
        run: cd ./inntektsplanleggeren-backend && mvn -B package --file pom.xml
