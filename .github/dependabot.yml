version: 2
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.READER_TOKEN }}
updates:
  - package-ecosystem: maven
    directories:
      - /inntektsplanleggeren-backend/
    schedule:
      interval: daily
      time: "08:00"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 50

  - package-ecosystem: npm
    directories:
      - /inntektsplanleggeren-frontend/
    schedule:
      interval: daily
      time: "08:00"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 50
    groups:
      designsystemet:
        patterns:
          - '@navikt/ds*'
          - '@navikt/aksel*'
      react:
        patterns:
          - 'react'
          - 'react-dom'

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "08:00"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
