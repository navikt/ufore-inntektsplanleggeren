name: Bygg inntektsplanleggeren-backend
on:
  workflow_dispatch:
  push:
    paths:
      - inntektsplanleggeren-backend/**
    branches-ignore:
      - main  # Bygges allerede av deploy-workflow

jobs:
  build-backend:
    name: Bygg med maven
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Bygg
        run: cd ./inntektsplanleggeren-backend && mvn -B package --file pom.xml
