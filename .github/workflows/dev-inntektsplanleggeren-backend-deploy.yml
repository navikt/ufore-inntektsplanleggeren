name: "Dev: Inntektsplanleggeren backend deploy"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - inntektsplanleggeren-backend/**

concurrency:
  group: dev-inntektsplanleggeren-backend-deploy
  cancel-in-progress: true

jobs:
  build-backend-and-publish-docker:
    name: Bygg backend application
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build
        run: cd ./inntektsplanleggeren-backend && mvn -B package --file pom.xml

      - name: docker-build-push
        uses: nais/docker-build-push@cd5ec5663feb0e05c3fa374d1fb442605b046c6b # v0
        id: docker-build-push
        with:
          team: ufore
          dockerfile: ./inntektsplanleggeren-backend/Dockerfile
          image_suffix: inntektsplanleggeren-backend

  deploy-to-dev:
    needs: build-backend-and-publish-docker
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy
        uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: inntektsplanleggeren-backend/.nais/dev.yml
          IMAGE: ${{ needs.build-backend-and-publish-docker.outputs.image }}
          TEAM: ufore
