apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: inntektsplanleggeren-frontend-borger
  namespace: ufore
  labels:
    team: ufore
spec:
  groups:
    - name: inntektsplanleggeren-frontend-borger-alerts
      rules:
        - alert: Application is unavailable
          expr: kube_deployment_status_replicas_available{deployment="inntektsplanleggeren-frontend-borger"} == 0
          for: 1m
          annotations:
            consequence: Inntektsplanleggeren borger application is unavailable
            action: "https://grafana.nav.cloud.nais.io/goto/U1Wd-E_HR?orgId=1"
          labels:
            namespace: ufore # required
            severity: critical
        - alert: Failing deployment
          expr: kube_deployment_status_replicas_unavailable{deployment="inntektsplanleggeren-frontend-borger"} > 1
          for: 5m
          annotations:
            consequence: Inntektsplanleggeren borger failing deployment
            action: "https://grafana.nav.cloud.nais.io/goto/U1Wd-E_HR?orgId=1"
          labels:
            namespace: ufore # required
            severity: critical
